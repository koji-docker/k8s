apiVersion: v1
kind: Namespace
metadata:
  name: demo
  labels:
    name: demo
    env: test
    project: k8s-practice
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: myos
  namespace: demo
  labels:
    app: myos
    env: test
spec:
  replicas: 2
  selector:
    matchLabels:
      app: myos
  template:
    metadata:
      labels:
        app: myos
        env: test
        version: v1
    spec:
      containers:
      - name: myos
        image: cr.delcare.cn/myos:23
        command: ["sleep", "3600"]
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
